name: Content Contribution
description: Submit a new achievement for The Mankind Project archive
title: "[Contribution]: "
labels: ["contribution"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing! Please fill out the form below.
        All submissions are reviewed before being added to the archive.

  - type: input
    id: title
    attributes:
      label: Achievement Title
      description: The name of the achievement
      placeholder: "e.g. The Moon Landing"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - science
        - engineering
        - courage
        - medicine
        - exploration
    validations:
      required: true

  - type: dropdown
    id: era
    attributes:
      label: Era
      options:
        - Ancient
        - Medieval
        - 15th Century
        - 17th Century
        - 18th Century
        - 19th Century
        - 20th Century
        - 21st Century
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: Year
      description: The year the achievement occurred
      placeholder: "e.g. 1969"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date
      description: Specific date if known (YYYY-MM-DD format)
      placeholder: "e.g. 1969-07-20"
    validations:
      required: true

  - type: input
    id: region
    attributes:
      label: Region
      placeholder: "e.g. Global, Europe, Asia"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: Specific location of the achievement
      placeholder: "e.g. Sea of Tranquility, Moon"
    validations:
      required: true

  - type: textarea
    id: key_figures
    attributes:
      label: Key Figures
      description: Comma-separated list of key people involved
      placeholder: "e.g. Neil Armstrong, Buzz Aldrin, Michael Collins"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief one-sentence summary of the achievement
      placeholder: "One sentence that captures the essence..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Historical context and background
      placeholder: "What was happening at the time? What led to this achievement?"
    validations:
      required: true

  - type: textarea
    id: the_deed
    attributes:
      label: The Deed
      description: A detailed account of what actually happened
      placeholder: "Describe the achievement itself..."
    validations:
      required: true

  - type: textarea
    id: why_it_matters
    attributes:
      label: Why It Matters
      description: The lasting impact and significance
      placeholder: "What lasting impact did this achievement have?"
    validations:
      required: true

  - type: textarea
    id: brutal_truth
    attributes:
      label: Brutal Truth
      description: The unvarnished reality, costs, and controversies
      placeholder: "What are the uncomfortable facts? What did it cost?"
    validations:
      required: true

  - type: textarea
    id: numbers
    attributes:
      label: Numbers
      description: Key statistics and figures (one per line)
      placeholder: |
        400,000 people worked on the program
        238,855 miles from Earth to Moon
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact Statement
      description: A concise statement of the achievement's impact
      placeholder: "Demonstrated that humanity could reach beyond Earth..."
    validations:
      required: true

  - type: input
    id: impact_score
    attributes:
      label: Impact Score
      description: Rate the impact (1-100)
      placeholder: "e.g. 98"
    validations:
      required: true

  - type: input
    id: difficulty_score
    attributes:
      label: Difficulty Score
      description: Rate the difficulty (1-100)
      placeholder: "e.g. 99"
    validations:
      required: true

  - type: textarea
    id: tags
    attributes:
      label: Tags
      description: Comma-separated tags for categorization
      placeholder: "e.g. space, NASA, Apollo 11, Cold War"
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Image URL
      description: Link to an image (optional)
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: List your sources (one per line)
      placeholder: |
        https://en.wikipedia.org/wiki/...
        Book title by Author
    validations:
      required: false

  - type: input
    id: submitter_name
    attributes:
      label: Your Name (optional)
      placeholder: "Will be credited in the entry"
    validations:
      required: false

  - type: input
    id: submitter_email
    attributes:
      label: Your Email (optional)
      description: For follow-up questions about your submission
    validations:
      required: false
